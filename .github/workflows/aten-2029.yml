name: BCL case pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: cases
        run: echo "ids=$(node scripts/case.cjs list)" >> "$GITHUB_OUTPUT"
  case:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          CASE_ID: ${{ matrix.id }}
        run: node scripts/case.cjs metadata "$CASE_ID"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.meta.outputs.node }}
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.meta.outputs.repository }}
          ref: ${{ steps.meta.outputs.revision }}
          path: ${{ steps.meta.outputs.directory }}
      - env:
          CASE_ID: ${{ matrix.id }}
        run: node scripts/case.cjs run "$CASE_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-test-build
          path: ${{ steps.meta.outputs.package }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && steps.meta.outcome == 'success'
        with:
          name: ${{ matrix.id }}-report
          path: |
            ${{ steps.meta.outputs.report }}
            cases/${{ matrix.id }}/case.json
          if-no-files-found: error
