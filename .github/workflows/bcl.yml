name: BCL v2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: bcl-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.selection.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            cases=$(node scripts/case.cjs select "$BASE")
          else
            cases=$(node scripts/case.cjs select)
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
  infrastructure:
    needs: select
    if: needs.select.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: node scripts/bcl.cjs harness
  cases:
    needs: select
    if: needs.select.outputs.cases != '[]'
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.select.outputs.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - env:
          CASE_ID: ${{ matrix.id }}
        run: |
          status=$(node -p "require('./cases/' + process.env.CASE_ID + '/case.json').status")
          if [ "$status" = diagnostic ]; then
            node scripts/bcl.cjs run "$CASE_ID" --legacy-contracts
          else
            node scripts/bcl.cjs run "$CASE_ID"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-evidence
          path: reports/${{ matrix.id }}/
          if-no-files-found: error
  result:
    if: always()
    needs: [select, infrastructure, cases]
    runs-on: ubuntu-latest
    steps:
      - env:
          SELECT: ${{ needs.select.result }}
          INFRA: ${{ needs.infrastructure.result }}
          CASES: ${{ needs.cases.result }}
        run: |
          test "$SELECT" = success
          test "$INFRA" = success -o "$INFRA" = skipped
          test "$CASES" = success -o "$CASES" = skipped
