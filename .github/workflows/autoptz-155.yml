name: BCL AutoPTZ UDP diagnostic
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  udp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 cases/autoptz-155/prepare.py
      - run: node cases/autoptz-155/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoptz-155-report
          path: reports/autoptz-155.json
          if-no-files-found: error
