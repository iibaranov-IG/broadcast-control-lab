name: BCL external case - ATEN 2029
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node cases/aten-2029/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aten-2029-report
          path: reports/aten-2029.json
          if-no-files-found: error
