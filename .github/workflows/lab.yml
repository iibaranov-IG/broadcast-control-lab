name: Broadcast Control Lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: iibaranov-IG/companion-module-intelix-digi88fs
          ref: 3834e91d22580ea0faa49057e9f38166cadc1e75
          fetch-depth: 0
          path: sources/intelix
      - uses: actions/checkout@v4
        with:
          repository: iibaranov-IG/companion-module-sennheiser-tcc2
          ref: 375e281ae819a7819f53328c4cf9c3689a1ab3b2
          path: sources/tcc2
      - run: npm test
        env:
          LAB_SOURCES: ${{ github.workspace }}/sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-report
          path: reports/latest.json
          if-no-files-found: error
